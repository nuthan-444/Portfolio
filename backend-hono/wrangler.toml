name = "portfolio-backend-hono"
main = "server.js"
compatibility_date = "2024-11-01"

# Enable Node.js compatibility — required for mongoose & cloudinary SDK
# which rely on Node.js built-ins (Buffer, net, crypto, etc.)
compatibility_flags = ["nodejs_compat"]

[vars]
# Public / non-sensitive env vars go here
# Sensitive values → use: wrangler secret put <KEY>
ADMIN_EMAIL = "forcodingstuffs@gmail.com"
SMTP_FROM_EMAIL = "forcodingstuffs@gmail.com"
FRONTEND_URL = "https://your-portfolio.pages.dev"

# Secrets (do NOT put values here — set with `wrangler secret put`):
# wrangler secret put MONGODB_URI
# wrangler secret put JWT_SECRET
# wrangler secret put CLOUDINARY_CLOUD_NAME
# wrangler secret put CLOUDINARY_API_KEY
# wrangler secret put CLOUDINARY_API_SECRET
# wrangler secret put SMTP2GO_API_KEY   (optional, for email notifications)
